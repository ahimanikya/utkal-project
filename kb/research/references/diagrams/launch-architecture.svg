<polyline points="380,777 25,777 25,614 187,614 187,587" fill="none" stroke="#8F2435" stroke-width="3"/><polygon points="187,587 181,598 193,598" fill="#8F2435"/>
<text x="45" y="910" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#8F2435">Deferred: Blaze, Firebase file storage/functions, AI chat and paid private backups.</text>

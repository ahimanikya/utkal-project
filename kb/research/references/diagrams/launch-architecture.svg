<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990" role="img"><title>Launch architecture</title><desc>Public knowledge is maintained in Git. Private contributions never enter the public build.</desc><rect width="100%" height="100%" fill="#F5EBDD"/>
<text x="45" y="48" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#8F2435">UTKALA · ODISHA  /  TECHNICAL ARCHITECTURE</text>
<text x="45" y="105" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#24211F">Launch architecture</text>
<text x="45" y="141" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#675D54">Public knowledge is maintained in Git. Private contributions never enter the public build.</text>
<text x="45" y="188" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#245C59">PUBLISHING — reviewed changes only</text>
<rect x="45" y="207" width="285" height="147" rx="14" fill="#FFFCF7" stroke="#245C59" stroke-width="2"/>
<text x="62" y="234" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245C59">PEOPLE</text>
<text x="62" y="271" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24211F">Maintainers</text>
<text x="62" y="302" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Edit and review content</text>
<text x="62" y="327" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Approve publication</text>
<rect x="380" y="207" width="285" height="147" rx="14" fill="#FFFCF7" stroke="#245C59" stroke-width="2"/>
<text x="397" y="234" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245C59">CANONICAL PUBLIC DATA</text>
<text x="397" y="271" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24211F">OKF knowledge in Git</text>
<text x="397" y="302" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Markdown · JSON · CSV</text>
<text x="397" y="327" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Approved display photos</text>
<rect x="715" y="207" width="285" height="147" rx="14" fill="#FFFCF7" stroke="#245C59" stroke-width="2"/>
<text x="732" y="234" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245C59">GITHUB ACTIONS</text>
<text x="732" y="271" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24211F">Checks + Astro build</text>
<text x="732" y="302" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Validate IDs and approvals</text>
<text x="732" y="327" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Build pages and Pagefind</text>
<rect x="1050" y="207" width="285" height="147" rx="14" fill="#FFFCF7" stroke="#245C59" stroke-width="2"/>
<text x="1067" y="234" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245C59">PUBLIC DELIVERY</text>
<text x="1067" y="271" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24211F">GitHub Pages</text>
<text x="1067" y="302" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Custom domain + HTTPS</text>
<text x="1067" y="327" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Read-only pages and data</text>
<polyline points="330,281 380,281" fill="none" stroke="#85776A" stroke-width="3"/><polygon points="380,281 369,275 369,287" fill="#85776A"/>
<polyline points="665,281 715,281" fill="none" stroke="#85776A" stroke-width="3"/><polygon points="715,281 704,275 704,287" fill="#85776A"/>
<polyline points="1000,281 1050,281" fill="none" stroke="#85776A" stroke-width="3"/><polygon points="1050,281 1039,275 1039,287" fill="#85776A"/>
<text x="45" y="420" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#8F2435">CONTRIBUTIONS — private intake, manual publication</text>
<rect x="45" y="440" width="285" height="147" rx="14" fill="#FFFCF7" stroke="#8F2435" stroke-width="2"/>
<text x="62" y="467" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#8F2435">MANUAL GATE</text>
<text x="62" y="504" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24211F">Editorial review</text>
<text x="62" y="535" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Check rights and credit</text>
<text x="62" y="560" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Prepare public Git change</text>
<rect x="380" y="440" width="285" height="147" rx="14" fill="#FFFCF7" stroke="#8F2435" stroke-width="2"/>
<text x="397" y="467" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#8F2435">PRIVATE</text>
<text x="397" y="504" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24211F">Project inbox</text>
<text x="397" y="535" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Photos + contributor notes</text>
<text x="397" y="560" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Private contact and consent</text>
<rect x="715" y="440" width="285" height="147" rx="14" fill="#FFFCF7" stroke="#8F2435" stroke-width="2"/>
<text x="732" y="467" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#8F2435">INTAKE</text>
<text x="732" y="504" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24211F">Form relay / email</text>
<text x="732" y="535" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Free relay if tested</text>
<text x="732" y="560" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Otherwise email directly</text>
<rect x="1050" y="440" width="285" height="147" rx="14" fill="#FFFCF7" stroke="#245C59" stroke-width="2"/>
<text x="1067" y="467" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245C59">PUBLIC INTERFACE</text>
<text x="1067" y="504" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24211F">Visitors</text>
<text x="1067" y="535" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Read, search, contribute</text>
<text x="1067" y="560" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">No GitHub login required</text>
<polyline points="1050,510 1000,510" fill="none" stroke="#8F2435" stroke-width="3"/><polygon points="1000,510 1011,504 1011,516" fill="#8F2435"/>
<polyline points="715,510 665,510" fill="none" stroke="#8F2435" stroke-width="3"/><polygon points="665,510 676,504 676,516" fill="#8F2435"/>
<polyline points="380,510 330,510" fill="none" stroke="#8F2435" stroke-width="3"/><polygon points="330,510 341,504 341,516" fill="#8F2435"/>
<polyline points="1192,354 1192,440" fill="none" stroke="#85776A" stroke-width="3"/><polygon points="1192,440 1186,429 1198,429" fill="#85776A"/>
<polyline points="187,440 187,430 25,430 25,374 187,374 187,354" fill="none" stroke="#8F2435" stroke-width="3"/><polygon points="187,354 181,365 193,365" fill="#8F2435"/>
<text x="45" y="666" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#245C59">USER FEATURES — Firebase Spark, within free quotas</text>
<rect x="380" y="704" width="285" height="147" rx="14" fill="#FFFCF7" stroke="#245C59" stroke-width="2"/>
<text x="397" y="731" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245C59">PRIVATE DYNAMIC DATA</text>
<text x="397" y="768" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24211F">Firestore</text>
<text x="397" y="799" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Text proposals, preferences</text>
<text x="397" y="824" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Rules protect each record</text>
<rect x="715" y="704" width="285" height="147" rx="14" fill="#FFFCF7" stroke="#245C59" stroke-width="2"/>
<text x="732" y="731" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245C59">IDENTITY</text>
<text x="732" y="768" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24211F">Authentication</text>
<text x="732" y="799" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Guest and editor sessions</text>
<text x="732" y="824" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#675D54">Roles checked by rules</text>
<polyline points="1100,587 1100,654 855,654 855,704" fill="none" stroke="#85776A" stroke-width="3"/><polygon points="855,704 849,693 861,693" fill="#85776A"/>

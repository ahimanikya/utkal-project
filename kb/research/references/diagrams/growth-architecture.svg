<text x="45" y="769" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#675D54">Lost uploads or review backlog → assess managed intake and automation.</text>
<text x="45" y="802" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#675D54">Search cannot answer well → evaluate cited AI; private records remain excluded.</text>
<text x="45" y="835" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#675D54">Quota pressure or recovery needs → review cost, exports and restoration before expansion.</text>

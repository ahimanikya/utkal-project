<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img"><title>Growth architecture</title><desc>Future design only. Add services when a measured need and an acceptable cost justify them.</desc><rect width="100%" height="100%" fill="#F5EBDD"/>

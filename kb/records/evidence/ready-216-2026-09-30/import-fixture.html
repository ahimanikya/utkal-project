<aside id="local-import-fixtures" style="padding:24px;background:#ede4d2;border:2px solid #92472f"><h2>Local import test · synthetic data only</h2><p>These controls supply a test File to the normal import form. They do not write browser storage or bypass the application’s preview. The operating-system file chooser is not tested.</p><button type="button" id="load-single-fixture">Load single-journey sample</button> <button type="button" id="load-library-fixture">Load collection sample</button></aside><script>
const sample={version:1,title:'Synthetic source coast',startDate:'2026-12-25',items:[{id:'place:konark',day:3,notes:'SOURCE: Keep a source note'},{id:'place:puri',day:4,notes:'SOURCE: Puri note'}],dayNotes:[{day:3,title:'SOURCE DAY',notes:'SOURCE DAY NOTES'}],reminders:[{id:'source-reminder',text:'SOURCE REMINDER',done:true}],checklist:['transport']};
function provideFixture(value){const input=document.querySelector('#import-journey'),transfer=new DataTransfer();transfer.items.add(new File([JSON.stringify(value)],'synthetic-journey.json',{type:'application/json'}));input.files=transfer.files;input.closest('details').open=true;input.dispatchEvent(new Event('change',{bubbles:true}));}
document.querySelector('#load-single-fixture').addEventListener('click',()=>provideFixture(sample));
document.querySelector('#load-library-fixture').addEventListener('click',()=>provideFixture({version:2,activeId:'source',trips:[{id:'source',plan:sample},{id:'second',plan:{version:1,title:'Synthetic quiet day',items:[],dayNotes:[{day:1,title:'SOURCE QUIET',notes:'A notebook day'}],reminders:[{id:'quiet-reminder',text:'Pack a notebook',done:false}]}}]}));
</script>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Utkal · overnight review</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5efe3;color:#234750;font:16px/1.6 system-ui}h1{font:36px Georgia;margin:0 0 12px}.tools{display:flex;gap:24px;flex-wrap:wrap;margin:20px 0}label{display:flex;gap:10px;align-items:center}select{padding:12px;font:inherit;max-width:70vw}.stage{width:100%;overflow:hidden;background:white;border:1px solid #b6a388}.stage iframe{border:0;transform-origin:top left;display:block}p{max-width:80ch}</style><h1>Utkal Project · morning review</h1><p>A focused visitor experience, with stronger saved journeys and portable books. The frame below uses the selected layout width; it is scaled only to fit this review window.</p><div class="tools"><label>Review page<select id="page"><option value="/">Home</option><option value="/explore/">Explore</option><option value="/destinations/bhubaneswar/">Bhubaneswar</option><option value="/knowledge/konark/">Konark</option><option value="/journey/">My journey</option><option value="/contribute/">Contribute</option></select></label><label>Layout width<select id="width"><option>360</option><option>768</option><option selected>1280</option><option>1600</option></select></label><button id="measure" type="button">Measure layout</button><a href="/" target="_blank">Open full preview</a></div><details><summary>Layout measurements</summary><pre id="measurements">Waiting for page</pre></details><div class="stage"><iframe title="Responsive website preview" src="/" width="1280" height="1000"></iframe></div><script>const frame=document.querySelector('iframe'),stage=document.querySelector('.stage'),page=document.querySelector('#page'),width=document.querySelector('#width');function measure(){const d=frame.contentDocument,w=frame.contentWindow;if(!d?.querySelector('main'))return;document.querySelector('#measurements').textContent=JSON.stringify({route:d.location.pathname,width:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,title:d.querySelector('h1')?.textContent,badImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src')),overflow:[...d.querySelectorAll('main p,main h1,main h2,main input,main select,main textarea')].filter(e=>e.getClientRects().length&&w.getComputedStyle(e).visibility!=='hidden'&&e.getBoundingClientRect().right>d.documentElement.clientWidth+2).map(e=>e.tagName+': '+e.textContent.slice(0,60))},null,2)}function fit(){const w=Number(width.value),scale=Math.min(1,stage.clientWidth/w);frame.width=String(w);frame.style.width=w+'px';frame.style.transform='scale('+scale+')';stage.style.height=1000*scale+'px';requestAnimationFrame(()=>requestAnimationFrame(measure))}page.addEventListener('change',()=>{frame.src=page.value});width.addEventListener('change',fit);window.addEventListener('resize',fit);frame.addEventListener('load',fit);document.querySelector('#measure').addEventListener('click',measure);fit();</script></html>
